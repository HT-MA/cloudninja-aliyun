    // 获取相关认证（同类别不同等级 + 同等级不同类别）
    function getRelatedCerts(key, cert) {
        const all = Object.entries(CERTIFICATIONS);
        let related = all.filter(([k, c]) => k !== key && c.category === cert.category);
        if (related.length < 3) {
            const extra = all.filter(([k, c]) =>
                k !== key && c.category !== cert.category && c.level === cert.level
            );
            related = related.concat(extra);
        }
        return related.slice(0, 3);
    }

        const observer = new IntersectionObserver((entries) => {

        app.querySelectorAll('.reveal').forEach(el => observer.observe(el));

                        <a href="certifications.html">认证指南</a>
                        <span class="sep">/</span>
                        <span>${esc(cert.name)}</span>
                    </div>
                    <span class="cert-detail-badge ${LEVEL_CLASS[cert.level]}" style="background: var(--accent-dim); color: var(--accent);">${esc(cert.levelText)}</span>
                    <h1>${esc(cert.name)}</h1>
                    <p class="subtitle">${esc(cert.description)}</p>
                    <div class="cert-info-grid">${infoHTML}</div>
                </div>
            </section>

            <section class="section" style="padding-top: 20px; padding-bottom: 80px;">
                <div class="container">
                    <div class="cert-content">
                        <div class="cert-content-main">
                            <h2>认证概述</h2>
                            <p>${esc(cert.overview)}</p>

                            <h2>考试内容</h2>
                            <p>本认证考试涵盖以下知识域与核心考点：</p>
                            <ul>${topicsHTML}</ul>

                            <h2>备考建议</h2>
                            <ul>${tipsHTML}</ul>

                            <h2>考试流程</h2>
                            <ul>${processHTML}</ul>

                            <h2>职业发展</h2>
                            <p>${esc(cert.career)}</p>
                        </div>

                        <aside class="cert-sidebar">
                            <div class="cert-sidebar-card">
                                <h4>考试知识域分布</h4>
                                ${domainBarsHTML}
                            </div>

                            <div class="cert-sidebar-card">
                                <h4>快速操作</h4>
                                ${examActionsHTML}
                            </div>

                            <div class="cert-sidebar-card">
                                <h4>相关认证推荐</h4>
                                ${relatedHTML}
                            </div>
                        </aside>
                    </div>
                </div>
            </section>
        `;

        // 动画填充进度条
        setTimeout(() => {
            app.querySelectorAll('.domain-bar-fill').forEach(bar => {
                bar.style.width = bar.dataset.target + '%';
            });
        }, 300);

        // 滚动到顶部
        window.scrollTo(0, 0);
    }

    // -------------------------------------------------------------------
    // 入口：根据 URL 参数决定渲染哪个视图
    // -------------------------------------------------------------------
    if (certKey && CERTIFICATIONS[certKey]) {
        renderDetailView(certKey, CERTIFICATIONS[certKey]);
    } else if (certKey) {
        // 参数无效，显示提示并回退到列表
        app.innerHTML = `
            <section class="page-header">
                <div class="page-header-bg"></div>
                <div class="container">
                    <div class="breadcrumb">
                        <a href="index.html">首页</a>
                        <span class="sep">/</span>
                        <span>认证指南</span>
                    </div>
                    <h1>未找到该认证</h1>
                    <p>你访问的认证不存在或参数有误，请从下方列表中选择有效的认证。</p>
                </div>
            </section>
        `;
        setTimeout(renderListView, 50);
    } else {
        renderListView();
    }
    </script>

    <script src="app.js"></script>
</body>
</html>
