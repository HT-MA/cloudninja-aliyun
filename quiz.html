        ],
        correctAnswer: 0,
        explanation: '快照是云盘数据在某一时刻的状态备份，可用于创建新云盘（克隆数据）、回滚云盘到历史状态、跨可用区/地域复制数据等。阿里云快照采用增量备份机制，仅保存自上次快照以来变化的数据块，存储成本远低于全量备份，且无需停机即可创建（运行中实例可在线创建快照，建议在业务低峰期创建以保证数据一致性）。快照不仅能回滚原云盘，也能用于创建新云盘迁移数据。',
        ref: 'help.aliyun.com/zh/ecs/user-guide/快照/'
    }
];

/* ===== 运行状态 ===== */
const state = {
    examCode: null,
    mode: 'practice',
    currentIndex: 0,
    userAnswers: [],
    submitted: [],
    finished: false,
    timeLeft: 0,
    timerId: null,
    questions: []
};

/* ===== 工具函数 ===== */
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(window.location.search);
const formatTime = (s) => {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const sec = (s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
};

const esc = (s) => String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));

const isAnswerCorrect = (q, ua) => {
    if (!ua || ua.length === 0) return false;
    if (q.type === '多选题') {
        if (ua.length !== q.correctAnswers.length) return false;
        return ua.every(a => q.correctAnswers.includes(a));
    }
    return ua[0] === q.correctAnswers[0];
};

/* ===== 初始化 ===== */
function init() {
    state.examCode = params.get('exam') || 'aca-cloud';
    state.mode = (params.get('mode') === 'exam') ? 'exam' : 'practice';

    const meta = EXAM_META[state.examCode];

    // 未知考试方向：给出友好提示，不再静默使用全题库
    if (!meta) {
        $('crumbExam').textContent = '未找到考试';
        $('pageTitle').textContent = '未找到该考试方向';
        $('examMeta').textContent = `未找到 "${state.examCode}" 对应的考试配置，请从模拟考试列表重新选择。`;
        $('quizTimer').textContent = '--:--';
        $('quizTimer').classList.add('no-timer');
        $('quizNav').style.display = 'none';
        $('questionArea').innerHTML = `
            <div class="quiz-empty">
                <h2>未找到该考试方向</h2>
                <p>「${esc(state.examCode)}」不存在或尚未开放，请从模拟考试列表中选择已有方向。</p>
                <a class="quiz-nav-btn primary" href="practice.html">返回模拟考试列表</a>
            </div>`;
        return;
    }

    state.questions = getQuestionsForExam(state.examCode, ORIGINAL_QUESTIONS);
    const Qs = state.questions;
    const topics = [...new Set(Qs.map(q => q.topic))].join(' / ');

    $('crumbExam').textContent = meta.name;
    $('pageTitle').innerHTML = `${meta.name}<span class="quiz-mode-badge ${state.mode}" id="modeBadge">${state.mode === 'practice' ? '练习模式' : '考试模式'}</span>`;
    const levelClass = meta.level === 'ACA' ? 'level-aca' : meta.level === 'ACP' ? 'level-acp' : 'level-ace';
    $('examMeta').innerHTML = `<span class="cert-level ${levelClass}">${meta.level}</span> &nbsp; 本场题数：<strong>${Qs.length}</strong> 题 &nbsp;·&nbsp; 知识域：${topics}`;

    state.userAnswers = new Array(Qs.length).fill(null);
    state.submitted = new Array(Qs.length).fill(false);
    state.currentIndex = 0;

    const timerEl = $('quizTimer');
    if (state.mode === 'exam') {
        state.timeLeft = Math.round(meta.duration * 60 * Qs.length / meta.qcount);
        timerEl.textContent = formatTime(state.timeLeft);
        startTimer();
    } else {
        timerEl.textContent = '不计时';
        timerEl.classList.add('no-timer');
    }

    $('quizNav').style.display = 'flex';
    renderQuestion();
    updateProgress();
    bindNav();
}

/* ===== 计时器 ===== */
function startTimer() {
    if (state.timerId) clearInterval(state.timerId);
    state.timerId = setInterval(() => {
        state.timeLeft--;
        const el = $('quizTimer');
        el.textContent = formatTime(state.timeLeft);
        el.classList.toggle('warning', state.timeLeft <= 300 && state.timeLeft > 60);
        el.classList.toggle('danger', state.timeLeft <= 60);
        if (state.timeLeft <= 0) {
            clearInterval(state.timerId);
            alert('考试时间到，系统将自动交卷。');
            finishExam(true);
        }
    }, 1000);
}

/* ===== 渲染当前题目 ===== */
function renderQuestion() {
    const i = state.currentIndex;
    const q = state.questions[i];
    const ua = state.userAnswers[i];
    const isSubmitted = state.submitted[i];
    const showResult = isSubmitted || state.finished;

    const optionLetters = ['A', 'B', 'C', 'D', 'E', 'F'];
    let optionsHTML = '';
    q.options.forEach((opt, idx) => {
        let cls = 'quiz-option';
        const isSelected = ua && ua.includes(idx);
        if (showResult) {
            cls += ' disabled';
            if (q.correctAnswers.includes(idx)) cls += ' correct';
            if (isSelected && !q.correctAnswers.includes(idx)) cls += ' wrong';
        } else if (isSelected) {
            cls += ' selected';
        }
        optionsHTML += `
            <div class="${cls}" data-idx="${idx}" onclick="selectOption(${idx})">
                <span class="key">${optionLetters[idx]}</span>
                <span>${opt}</span>
            </div>`;
    });

    let explanationHTML = '';
    if (showResult) {
        const correct = isAnswerCorrect(q, ua);
        const correctLetters = q.correctAnswers.map(a => optionLetters[a]).join('、');
        explanationHTML = `
            <div class="quiz-explanation">
                <h4>${correct ? '回答正确' : '回答错误'} · 正确答案：${correctLetters}</h4>
                <p>${q.explanation}</p>
                <div class="ref">📖 参考：${q.ref}</div>
            </div>`;
    }

    const diffColor = q.difficulty === '简单' ? 'var(--green)' : q.difficulty === '中等' ? 'var(--warm)' : 'var(--red)';

    $('questionArea').innerHTML = `
        <div class="quiz-question">
            <div class="quiz-q-meta">
                <span class="quiz-q-tag difficulty" style="color:${diffColor}">${q.difficulty}</span>
                <span class="quiz-q-tag topic">${q.topic}</span>
                <span class="quiz-q-tag type">${q.type}</span>
                <span class="quiz-q-number">第 ${i + 1} 题 / 共 ${state.questions.length} 题</span>
            </div>
            <h2>${q.question}</h2>
            <div class="quiz-options">${optionsHTML}</div>
            ${explanationHTML}
        </div>`;

    updateNavButtons();
}

/* ===== 选择选项 ===== */
function selectOption(idx) {
    const i = state.currentIndex;
    if (state.submitted[i] || state.finished) return;
    const q = state.questions[i];
    if (q.type === '多选题') {
        if (!state.userAnswers[i]) state.userAnswers[i] = [];
        const pos = state.userAnswers[i].indexOf(idx);
        if (pos >= 0) {
            state.userAnswers[i].splice(pos, 1);
            if (state.userAnswers[i].length === 0) state.userAnswers[i] = null;
        } else {
            state.userAnswers[i].push(idx);
        }
    } else {
        state.userAnswers[i] = [idx];
    }
    renderQuestion();
    updateProgress();
}

/* ===== 进度条 ===== */
function updateProgress() {
    const total = state.questions.length;
    const answered = state.userAnswers.filter(a => a && a.length > 0).length;
    const pct = (answered / total) * 100;
    $('progressFill').style.width = pct + '%';
    $('progressText').textContent = `已答 ${answered} / ${total}`;
}

/* ===== 导航按钮 ===== */
function updateNavButtons() {
    const i = state.currentIndex;
    const last = state.questions.length - 1;
    $('prevBtn').disabled = (i === 0);

    const actionBtn = $('actionBtn');
    const reviewBtn = $('reviewBtn');
    reviewBtn.style.display = 'none';

    if (state.finished) {
        reviewBtn.style.display = '';
        reviewBtn.textContent = '← 返回成绩单';
        reviewBtn.onclick = () => renderResults();
        actionBtn.textContent = (i === last) ? '已是最后一题' : '下一题 →';
        actionBtn.disabled = (i === last);
        return;
    }

    if (state.mode === 'practice') {
        if (!state.submitted[i]) {
            actionBtn.textContent = '提交本题 ✓';
            actionBtn.disabled = (!state.userAnswers[i] || state.userAnswers[i].length === 0);
        } else {
            if (i === last) {
                actionBtn.textContent = '查看成绩 📊';
            } else {
                actionBtn.textContent = '下一题 →';
            }
            actionBtn.disabled = false;
        }
    } else {
        if (i === last) {
            actionBtn.textContent = '交卷 📤';
        } else {
            actionBtn.textContent = '下一题 →';
        }
        actionBtn.disabled = false;
    }
}

/* ===== 绑定导航 ===== */
function bindNav() {
    $('prevBtn').addEventListener('click', () => {
        if (state.currentIndex > 0) {
            state.currentIndex--;
            renderQuestion();
        }
    });

    $('actionBtn').addEventListener('click', () => {
        const i = state.currentIndex;
        const last = state.questions.length - 1;

        if (state.finished) {
            if (i === last) {
                renderResults();
            } else {
                state.currentIndex++;
                renderQuestion();
            }
            return;
        }

        if (state.mode === 'practice') {
            if (!state.submitted[i]) {
                if (!state.userAnswers[i] || state.userAnswers[i].length === 0) return;
                state.submitted[i] = true;
                renderQuestion();
            } else {
                if (i === last) {
                    finishExam(false);
                } else {
                    state.currentIndex++;
                    renderQuestion();
                }
            }
        } else {
            if (i === last) {
                const unanswered = state.userAnswers.filter(a => !a || a.length === 0).length;
                if (unanswered > 0) {
                    if (!confirm(`还有 ${unanswered} 题未作答，确定交卷吗？`)) return;
                } else {
                    if (!confirm('确定交卷吗？交卷后将统一批改并显示成绩。')) return;
                }
                finishExam(false);
            } else {
                state.currentIndex++;
                renderQuestion();
            }
        }
    });
}

/* ===== 交卷 / 显示成绩 ===== */
function finishExam(auto) {
    if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
    // 交卷后所有题进入"已批改"状态，renderQuestion 依据 state.finished 展示正确/错误与解析
    state.finished = true;
    renderResults();
}

/* ===== 成绩单 ===== */
function renderResults() {
    const total = state.questions.length;
    const meta = EXAM_META[state.examCode] || { passScore: 80 };
    let correct = 0, wrong = 0, blank = 0;
    state.questions.forEach((q, i) => {
        const ua = state.userAnswers[i];
        if (!ua || ua.length === 0) blank++;
        else if (isAnswerCorrect(q, ua)) correct++;
        else wrong++;
    });
    const unanswered = state.userAnswers.filter(a => !a || a.length === 0).length;

    const score = Math.round((correct / total) * 100);
    const pct = score;
    const passScore = meta.passScore;
    const passed = score >= passScore;

    const r = 90;
    const circ = 2 * Math.PI * r;
    const offset = circ * (1 - pct / 100);
    const ringColor = passed ? 'var(--green)' : (score >= 60 ? 'var(--accent)' : 'var(--red)');
    const verdict = passed
        ? `恭喜，你的成绩已达到阿里云认证通过线（${passScore} 分），继续保持！`
        : (score >= 60
            ? `成绩接近通过线，再针对薄弱知识点加强练习即可通关。`
            : `成绩未达通过线，建议回到练习模式逐题突破并复习相关官方文档。`);

    const optionLetters = ['A', 'B', 'C', 'D', 'E', 'F'];
    let pillsHTML = '';
    state.questions.forEach((q, i) => {
        const ua = state.userAnswers[i];
        let pcls = 'quiz-review-pill';
        let title = `第 ${i + 1} 题`;
        if (!ua || ua.length === 0) {
            pcls += ' wrong';
            title += ' · 未作答';
        } else if (isAnswerCorrect(q, ua)) {
            pcls += ' correct';
            title += ' · 正确';
        } else {
            pcls += ' wrong';
            const userLetters = ua.map(a => optionLetters[a]).join('');
            const correctLetters = q.correctAnswers.map(a => optionLetters[a]).join('');
            title += ` · 错误（你选 ${userLetters}，正确 ${correctLetters}）`;
        }
        pillsHTML += `<div class="${pcls}" title="${title}" onclick="jumpTo(${i})">${i + 1}</div>`;
    });

    $('quizNav').style.display = 'none';
    $('questionArea').innerHTML = `
        <div class="quiz-results">
            <div class="score-ring">
                <svg width="200" height="200">
                    <circle class="bg" cx="100" cy="100" r="${r}" fill="none" stroke-width="12"></circle>
                    <circle class="fg" cx="100" cy="100" r="${r}" fill="none" stroke-width="12"
                        stroke-linecap="round"
                        stroke-dasharray="${circ}"
                        stroke-dashoffset="${circ}"
                        style="stroke:${ringColor};"></circle>
                </svg>
                <div class="score-text">
                    <div class="score-number" id="scoreNumber">0</div>
                    <div class="score-label">/ 100 分</div>
                </div>
            </div>
            <h2>${passed ? '通关达成' : '继续努力'}</h2>
            <p class="verdict">${verdict}</p>
            <div class="stats">
                <div class="stat">
                    <div class="stat-num" style="color:var(--green)">${correct}</div>
                    <div class="stat-label">答对</div>
                </div>
                <div class="stat">
                    <div class="stat-num" style="color:var(--red)">${wrong + unanswered}</div>
                    <div class="stat-label">答错 / 未答</div>
                </div>
                <div class="stat">
                    <div class="stat-num">${total}</div>
                    <div class="stat-label">总题数</div>
                </div>
                <div class="stat">
                    <div class="stat-num" style="color:${passed ? 'var(--green)' : 'var(--warm)'}">${passed ? '通过' : '未通过'}</div>
                    <div class="stat-label">评定</div>
                </div>
            </div>

            <div style="font-size:14px;color:var(--text-2);margin-bottom:8px;">点击题号可查看每题解析</div>
            <div class="quiz-review-list">${pillsHTML}</div>

            <div class="actions">
                <a class="quiz-nav-btn primary" href="quiz.html?exam=${state.examCode}&mode=practice">重做（练习模式）</a>
                <a class="quiz-nav-btn" href="quiz.html?exam=${state.examCode}&mode=exam">重做（考试模式）</a>
                <a class="quiz-nav-btn" href="practice.html">返回考试列表</a>
            </div>
        </div>`;

    // 分数动画 + 环形进度条动画
    animateScore(score);
    animateRing(offset);
}

function animateScore(target) {
    const el = $('scoreNumber');
    let cur = 0;
    const step = Math.max(1, Math.ceil(target / 40));
    const t = setInterval(() => {
        cur += step;
        if (cur >= target) { cur = target; clearInterval(t); }
        el.textContent = cur;
    }, 30);
}

function animateRing(finalOffset) {
    // 环形进度条：初始 stroke-dashoffset 为满偏移（空环），动画到最终偏移
    const fg = document.querySelector('.quiz-results .score-ring .fg');
    if (!fg) return;
    // 强制重排以触发 CSS transition
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            fg.style.strokeDashoffset = finalOffset;
        });
    });
}

/* ===== 题号回顾跳转 ===== */
function jumpTo(idx) {
    state.currentIndex = idx;
    renderQuestion();
    // 查看模式下保留导航条，便于前后翻阅与返回成绩单
    $('quizNav').style.display = 'flex';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ===== 启动 ===== */
document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
